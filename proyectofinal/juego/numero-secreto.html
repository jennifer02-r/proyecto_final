<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Juego de Adivinanza Numérica</title>
    <style>
        :root {
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --text-color: #f8fafc;
            --accent-color: #3b82f6;
            --accent-hover: #2563eb;
            --danger-color: #ef4444;
            --success-color: #22c55e;
            --border-color: #334155;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }

        .game-container {
            background-color: var(--card-bg);
            padding: 2.5rem;
            border-radius: 1rem;
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.3), 0 8px 10px -6px rgba(0, 0, 0, 0.3);
            width: 100%;
            max-width: 400px;
            text-align: center;
            border: 1px solid var(--border-color);
            transition: all 0.3s ease;
        }

        h1 {
            margin-bottom: 0.5rem;
            font-size: 1.75rem;
            color: #f1f5f9;
        }

        p.instructions {
            color: #94a3b8;
            font-size: 0.95rem;
            margin-bottom: 1.5rem;
        }

        .input-group {
            display: flex;
            gap: 0.5rem;
            margin-bottom: 1rem;
        }

        input[type="number"] {
            flex: 1;
            padding: 0.75rem 1rem;
            border-radius: 0.5rem;
            border: 1px solid var(--border-color);
            background-color: #0f172a;
            color: var(--text-color);
            font-size: 1rem;
            outline: none;
            transition: border-color 0.2s;
        }

        input[type="number"]:focus {
            border-color: var(--accent-color);
        }

        button {
            padding: 0.75rem 1.25rem;
            border-radius: 0.5rem;
            border: none;
            background-color: var(--accent-color);
            color: white;
            font-weight: 600;
            cursor: pointer;
            transition: background-color 0.2s, transform 0.1s;
        }

        button:hover {
            background-color: var(--accent-hover);
        }

        button:active {
            transform: scale(0.98);
        }

        button:disabled {
            background-color: #475569;
            cursor: not-allowed;
            transform: none;
        }

        .status-panel {
            margin: 1.25rem 0;
            padding: 0.75rem;
            border-radius: 0.5rem;
            font-weight: 500;
            font-size: 0.95rem;
            background-color: rgba(255, 255, 255, 0.03);
            border: 1px dashed var(--border-color);
        }

        .attempts-counter {
            font-size: 0.9rem;
            color: #cbd5e1;
            margin-bottom: 1.25rem;
        }

        .attempts-counter span {
            font-weight: bold;
            color: var(--accent-color);
        }

        #btn-reiniciar {
            width: 100%;
            background-color: #475569;
            display: none;
        }

        #btn-reiniciar:hover {
            background-color: #64748b;
        }

        /* Clases de estado dinámicas para innovación visual */
        .game-container.success {
            border-color: var(--success-color);
            box-shadow: 0 0 20px rgba(34, 197, 94, 0.2);
        }

        .game-container.error {
            border-color: var(--danger-color);
            box-shadow: 0 0 20px rgba(239, 68, 68, 0.2);
        }
    </style>
</head>
<body>

    <div class="game-container" id="gameContainer">
        <h1>Adivina el Número</h1>
        <p class="instructions">Estoy pensando en un número del <strong>1 al 10</strong>. ¡Intenta adivinarlo!</p>

        <div class="attempts-counter">
            Intentos restantes: <span id="intentosRestantes">3</span>
        </div>

        <div class="input-group" id="inputGroup">
            <input type="number" id="inputNumero" min="1" max="10" placeholder="Ej. 5">
            <button id="btnAdivinar" onclick="verificarAdivinanza()">Adivinar</button>
        </div>

        <div class="status-panel" id="mensajeEstado">¡Comienza el juego!</div>

        <button id="btn-reiniciar" onclick="reiniciarJuego()">Reiniciar Partida</button>
    </div>

    <script>
        let numeroSecreto = Math.floor(Math.random() * 10) + 1;
        let intentosRestantes = 3;
        let juegoTerminado = false;

        const inputNumero = document.getElementById('inputNumero');
        const mensajeEstado = document.getElementById('mensajeEstado');
        const spanIntentos = document.getElementById('intentosRestantes');
        const btnAdivinar = document.getElementById('btnAdivinar');
        const btnReiniciar = document.getElementById('btn-reiniciar');
        const gameContainer = document.getElementById('gameContainer');

        // Permitir presionar "Enter" para enviar
        inputNumero.addEventListener('keypress', function (e) {
            if (e.key === 'Enter' && !juegoTerminado) {
                verificarAdivinanza();
            }
        });

        function verificarAdivinanza() {
            const valorInput = inputNumero.value.trim();

            // Validar campos vacíos o fuera de rango
            if (valorInput === '') {
                mensajeEstado.textContent = '⚠️ Por favor, introduce un número.';
                mensajeEstado.style.color = '#facc15';
                return;
            }

            const numeroUsuario = parseInt(valorInput, 10);

            if (numeroUsuario < 1 || numeroUsuario > 10) {
                mensajeEstado.textContent = '⚠️ El número debe estar entre 1 y 10.';
                mensajeEstado.style.color = '#facc15';
                inputNumero.value = '';
                return;
            }

            // Restar un intento
            intentosRestantes--;
            spanIntentos.textContent = intentosRestantes;

            // Limpiar el campo después de cada intento
            inputNumero.value = '';

            if (numeroUsuario === numeroSecreto) {
                // Adivinó correctamente
                terminarJuego(true, `🎉 ¡Felicidades! Has adivinado el número secreto (${numeroSecreto}).`);
            } else if (intentosRestantes === 0) {
                // Perdió por quedarse sin intentos
                terminarJuego(false, `❌ ¡Has perdido! El número secreto era: ${numeroSecreto}.`);
            } else {
                // Sigue jugando, indicar si es mayor o menor
                if (numeroUsuario < numeroSecreto) {
                    mensajeEstado.textContent = `📈 El número secreto es MAYOR que ${numeroUsuario}.`;
                } else {
                    mensajeEstado.textContent = `📉 El número secreto es MENOR que ${numeroUsuario}.`;
                }
                mensajeEstado.style.color = '#f8fafc';
                inputNumero.focus();
            }
        }

        function terminarJuego(ganado, mensaje) {
            juegoTerminado = true;
            mensajeEstado.textContent = mensaje;
            mensajeEstado.style.color = ganado ? 'var(--success-color)' : 'var(--danger-color)';
            
            // Aplicar innovación visual de colores en el contenedor principal
            gameContainer.classList.add(ganado ? 'success' : 'error');

            // Deshabilitar controles de juego y mostrar botón de reinicio
            inputNumero.disabled = true;
            btnAdivinar.disabled = true;
            btnReiniciar.style.display = 'block';
            btnReiniciar.focus();
        }

        function reiniciarJuego() {
            numeroSecreto = Math.floor(Math.random() * 10) + 1;
            intentosRestantes = 3;
            juegoTerminado = false;

            spanIntentos.textContent = intentosRestantes;
            mensajeEstado.textContent = '¡Nueva partida iniciada! Suerte.';
            mensajeEstado.style.color = 'var(--text-color)';

            inputNumero.disabled = false;
            btnAdivinar.disabled = false;
            inputNumero.value = '';
            
            // Ocultar botón de reinicio y limpiar estilos visuales de estado
            btnReiniciar.style.display = 'none';
            gameContainer.classList.remove('success', 'error');
            
            inputNumero.focus();
        }
    </script>
</body>
</html>
